  <path d="M 288 364 L 312 364 Q 324 364 324 352 L 324 226 Q 324 216 334 216 L 870 216 Q 880 216 880 226 L 880 236" stroke="#69db7c" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowGreen)"/>

