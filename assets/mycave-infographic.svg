  <path d="M 505 324 L 505 346" stroke="#b197fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M 505 462 L 505 440" stroke="#b197fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

