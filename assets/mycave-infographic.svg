  <text x="650" y="595" fill="#c9d1d9" font-size="11.5" font-weight="600">Goodnotes Auto-Backup PDF</text>
  <circle cx="855" cy="591" r="6" fill="#69db7c"/>
  <text x="870" y="595" fill="#c9d1d9" font-size="11.5" font-weight="600">Calendar &amp; Reminders</text>
